name: Native art and continuous route evidence

on:
  workflow_call:
    inputs:
      selected_case_ids:
        description: 'all or unique existing case IDs separated by commas'
        type: string
        required: false
        default: all
  workflow_dispatch:
    inputs:
      selected_case_ids:
        description: 'all or unique existing case IDs separated by commas'
        type: string
        required: false
        default: all

permissions:
  contents: read

jobs:
  select:
    name: Validate native capture selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      case_ids: ${{ steps.selection.outputs.case_ids }}
      count: ${{ steps.selection.outputs.count }}
    steps:
      - name: Initialize selection evidence
        env:
          AUTHORED_SHA: ${{ github.sha }}
          SELECTED_CASE_IDS: ${{ inputs.selected_case_ids }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-selection"
          python3 - <<'PY_SELECTION_ENVELOPE'
          import json, os
          from pathlib import Path
          target = Path(os.environ['GITHUB_WORKSPACE']) / 'native-selection' / 'job-envelope.json'
          with target.open('x') as output:
              json.dump({'status':'INITIALIZED_NOT_EXECUTED','captureExecuted':False,'authoredDispatchSha':os.environ['AUTHORED_SHA'],'rawSelection':os.environ['SELECTED_CASE_IDS'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT']}, output, indent=2)
              output.write('\n')
          PY_SELECTION_ENVELOPE
      - name: Check out the exact selector and policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source/selection
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing IDs and emit bounded matrix
        id: selection
        env:
          AUTHORED_SHA: ${{ github.sha }}
          SELECTED_CASE_IDS: ${{ inputs.selected_case_ids }}
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/source/selection/tools/native-review/select-native-cases.py" \
            --source-root "$GITHUB_WORKSPACE/source/selection" \
            --output "$GITHUB_WORKSPACE/native-selection/selection.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve selection including validation failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-selection/
          if-no-files-found: error
          retention-days: 30

  capture:
    needs: select
    name: ${{ matrix.evidence_label }} (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      # Each job has its own VM; each pair still closes its owned browser before the next mode.
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Initialize failure-preserving job envelope
        env:
          CASE_ID: ${{ matrix.id }}
          DISPATCHED_SHA: ${{ github.sha }}
          EVIDENCE_LABEL: ${{ matrix.evidence_label }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-evidence/$CASE_ID"
          python3 - <<'PY_ENVELOPE'
          import json, os
          from pathlib import Path
          target = Path(os.environ['GITHUB_WORKSPACE']) / 'native-evidence' / os.environ['CASE_ID'] / 'job-envelope.json'
          target.write_text(json.dumps({'status':'INITIALIZED_NOT_EXECUTED','artAcceptance':'NOT_APPLICABLE_LOW_FUNCTIONAL_ONLY' if os.environ['CASE_ID'] in ('continuous-tour','resident-loop') else 'PENDING_HUMAN_NATIVE_REVIEW','evidenceScope':os.environ['EVIDENCE_LABEL'],'case':os.environ['CASE_ID'],'authoredDispatchSha':os.environ['DISPATCHED_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'baselineSha':'7a90f7934b7c9d1af5c4494bf08c4ec337c373e4'}, indent=2)+'\n')
          PY_ENVELOPE
      - name: Check out fixed previous runtime
        uses: actions/checkout@v4
        with:
          ref: 7a90f7934b7c9d1af5c4494bf08c4ec337c373e4
          path: source/baseline
          persist-credentials: false
      - name: Check out this authored candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source/authored
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/authored/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare CPU builds, then capture owned browsers in sequence
        env:
          AUTHORED_SHA: ${{ github.sha }}
          CASE_ID: ${{ matrix.id }}
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/source/authored/tools/native-review/run-paired-native.py" \
            --case "$CASE_ID" \
            --baseline-root "$GITHUB_WORKSPACE/source/baseline" \
            --authored-root "$GITHUB_WORKSPACE/source/authored" \
            --evidence-root "$GITHUB_WORKSPACE/native-evidence/$CASE_ID"
      - name: Preserve original evidence even when capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/${{ matrix.id }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
