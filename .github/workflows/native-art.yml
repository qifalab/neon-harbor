name: Native art and continuous route evidence

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: ${{ matrix.evidence_label }} (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { id: home, job_timeout_minutes: 110, evidence_label: 'Native High' }
          - { id: workshop, job_timeout_minutes: 95, evidence_label: 'Native High' }
          - { id: south-090, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: south-091, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: south-092, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: south-094, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: south-095, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: south-096, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: resident-core, job_timeout_minutes: 85, evidence_label: 'Native High' }
          - { id: bus, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: tram, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: ferry, job_timeout_minutes: 80, evidence_label: 'Native High' }
          - { id: waterfront-day, job_timeout_minutes: 80, evidence_label: 'Native High' }
          - { id: waterfront-night, job_timeout_minutes: 80, evidence_label: 'Native High' }
          - { id: east-interior, job_timeout_minutes: 180, evidence_label: 'Native High' }
          - { id: north-book, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: north-phone, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: north-cup-owner, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: south-parcel, job_timeout_minutes: 75, evidence_label: 'Native High' }
          - { id: ownership-bus, job_timeout_minutes: 80, evidence_label: 'Native High' }
          - { id: ownership-tram, job_timeout_minutes: 80, evidence_label: 'Native High' }
          - { id: ownership-ferry, job_timeout_minutes: 80, evidence_label: 'Native High' }
          - { id: continuous-tour, job_timeout_minutes: 300, evidence_label: 'Low functional tour' }
    steps:
      - name: Initialize failure-preserving job envelope
        env:
          CASE_ID: ${{ matrix.id }}
          DISPATCHED_SHA: ${{ github.sha }}
          EVIDENCE_LABEL: ${{ matrix.evidence_label }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-evidence/$CASE_ID"
          python3 - <<'PY_ENVELOPE'
          import json, os
          from pathlib import Path
          target = Path(os.environ['GITHUB_WORKSPACE']) / 'native-evidence' / os.environ['CASE_ID'] / 'job-envelope.json'
          target.write_text(json.dumps({'status':'INITIALIZED_NOT_EXECUTED','artAcceptance':'NOT_APPLICABLE_LOW_FUNCTIONAL_ONLY' if os.environ['CASE_ID']=='continuous-tour' else 'PENDING_HUMAN_NATIVE_REVIEW','evidenceScope':os.environ['EVIDENCE_LABEL'],'case':os.environ['CASE_ID'],'authoredDispatchSha':os.environ['DISPATCHED_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'baselineSha':'7a90f7934b7c9d1af5c4494bf08c4ec337c373e4'}, indent=2)+'\n')
          PY_ENVELOPE
      - name: Check out fixed previous runtime
        uses: actions/checkout@v4
        with:
          ref: 7a90f7934b7c9d1af5c4494bf08c4ec337c373e4
          path: source/baseline
          persist-credentials: false
      - name: Check out this authored candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source/authored
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/authored/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare CPU builds, then capture owned browsers in sequence
        env:
          AUTHORED_SHA: ${{ github.sha }}
          CASE_ID: ${{ matrix.id }}
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/source/authored/tools/native-review/run-paired-native.py" \
            --case "$CASE_ID" \
            --baseline-root "$GITHUB_WORKSPACE/source/baseline" \
            --authored-root "$GITHUB_WORKSPACE/source/authored" \
            --evidence-root "$GITHUB_WORKSPACE/native-evidence/$CASE_ID"
      - name: Preserve original evidence even when capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/${{ matrix.id }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
