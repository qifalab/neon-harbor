name: GitHub Pages

on:
  # Publish main only after the full verification pipeline. Keep manual dispatch
  # for a pinned ref when a release needs an explicit review.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          # Re-running deploy keeps the previous attempt's artifact. Select only
          # this attempt so deploy-pages never sees two equally named uploads.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy the verified revision
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the live deployed game
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: node tools/check-live.mjs "$DEPLOYED_URL"
      - name: Retain live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-smoke-${{ github.run_attempt }}
          path: test-results/live-smoke/
          if-no-files-found: ignore
