name: GitHub Pages

on:
  # Publish the selected revision only after the full verification pipeline.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy the verified revision
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live deployed game
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: node tools/check-live.mjs "$DEPLOYED_URL"
      - name: Retain live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-smoke
          path: test-results/live-smoke/
          if-no-files-found: ignore
