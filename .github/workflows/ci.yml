name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and gameplay tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [game, stability, metropolis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/${{ matrix.suite }}.spec.js
      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
