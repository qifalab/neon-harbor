name: Temporary immutable199 Ferry original evidence forwarding

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: original-evidence-forward-199-ferry-20261005-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forward_original:
    name: CPU-only fixed199 Ferry FAIL original archive forwarding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/evidence-forward
      - name: Verify fixed source and whole original archive, prepare ordered parts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/evidence-forward/forward-one-immutable-199-ferry-high-original.py --output-dir "$RUNNER_TEMP/original-forward-199-ferry"
      - name: Upload small original JSON logs PNG and failure metadata first
        uses: actions/upload-artifact@v4
        with:
          name: original-199-ferry-failure-small
          path: ${{ runner.temp }}/original-forward-199-ferry/small/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload verified original ZIP raw first400MiB
        uses: actions/upload-artifact@v4
        with:
          name: original-199-ferry-zip-part1
          path: ${{ runner.temp }}/original-forward-199-ferry/original.zip.part1
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload verified original ZIP raw remainder
        uses: actions/upload-artifact@v4
        with:
          name: original-199-ferry-zip-part2
          path: ${{ runner.temp }}/original-forward-199-ferry/original.zip.part2
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload safe failure receipt if forwarding failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: original-199-ferry-forward-failure-receipt
          path: ${{ runner.temp }}/original-forward-199-ferry/FORWARD_RECEIPT.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
