name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and gameplay tests (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: game, suite: game, shard: '1/1' }
          - { id: stability, suite: stability, shard: '1/1' }
          - { id: metropolis-1, suite: metropolis, shard: '1/3' }
          - { id: metropolis-2, suite: metropolis, shard: '2/3' }
          - { id: metropolis-3, suite: metropolis, shard: '3/3' }
          - { id: living-city, suite: living-city, shard: '1/1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/${{ matrix.suite }}.spec.js --fully-parallel --shard=${{ matrix.shard }}
      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
