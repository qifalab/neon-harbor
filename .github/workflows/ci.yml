name: Temporary immutable 9cf original evidence forwarding

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: original-evidence-forward-9cf-20261005-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forward_original:
    name: CPU-only original ${{ matrix.kind }} archive forwarding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [bus, tram]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/evidence-forward
      - name: Read exact original archive and prepare verified parts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/evidence-forward/forward-two-immutable-9cf-high-originals.py --kind '${{ matrix.kind }}' --output-dir "$RUNNER_TEMP/original-forward-${{ matrix.kind }}"
      - name: Upload small original metadata/photos and first failure first
        uses: actions/upload-artifact@v4
        with:
          name: original-9cf-${{ matrix.kind }}-failure-small
          path: ${{ runner.temp }}/original-forward-${{ matrix.kind }}/small/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload original ZIP raw first400MiB
        uses: actions/upload-artifact@v4
        with:
          name: original-9cf-${{ matrix.kind }}-zip-part1
          path: ${{ runner.temp }}/original-forward-${{ matrix.kind }}/original.zip.part1
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload original ZIP raw remainder
        uses: actions/upload-artifact@v4
        with:
          name: original-9cf-${{ matrix.kind }}-zip-part2
          path: ${{ runner.temp }}/original-forward-${{ matrix.kind }}/original.zip.part2
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload safe failure receipt if forwarding failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: original-9cf-${{ matrix.kind }}-forward-failure-receipt
          path: ${{ runner.temp }}/original-forward-${{ matrix.kind }}/FORWARD_RECEIPT.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
