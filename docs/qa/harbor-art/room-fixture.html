<!doctype html><html><head><meta charset="utf-8"><title>Harbor sample actual shop-room craft</title><style>html,body{margin:0;overflow:hidden}#caption{position:absolute;left:24px;bottom:24px;color:#eae6d9;background:#213b3ddd;padding:12px 16px;font:13px system-ui}</style></head><body><div id="caption">Original harbor shop-room craft · actual interior layout and collision furniture</div><script type="module">
import * as THREE from '../../../vendor/three/three.module.js';import {createWorld}from'../../../src/world.js';import{expansionBuilding}from'../../../src/expansion-programmes.js';import{createInteriorSystem,createInteriorLayout}from'../../../src/metropolis-interiors.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b6c3bb');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,800);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight('#ede8d7','#6d7e73',2.1));const sun=new THREE.DirectionalLight('#ffeacb',2.3);sun.position.set(230,60,175);scene.add(sun);const world=createWorld(THREE,new THREE.Scene(),{streaming:false});const buildings=world.buildings.map((b,i)=>expansionBuilding(b,'south',i));const interior=createInteriorSystem(THREE,scene,{buildings});const camera=new THREE.PerspectiveCamera(62,1.6,.035,120);let layout;const view=id=>{interior.enter(id);const b=buildings.find(b=>b.id===id);layout=createInteriorLayout(b,b.floors[0]);const r=layout.rooms[0];camera.position.set(r.arrival.x-.10,b.floors[0].y+1.65,r.arrival.z+.38);camera.lookAt(r.bounds.minX+1.35,b.floors[0].y+1.22,r.z-.23);renderer.render(scene,camera);};view('south-092');window.fixture={view,snapshot:()=>({interior:interior.snapshot(),layoutRooms:layout.rooms,camera:{position:camera.position.toArray(),quaternion:camera.quaternion.toArray(),fov:camera.fov,near:camera.near,far:camera.far},fixtureRenderer:{pixelRatio:renderer.getPixelRatio(),shadowMapEnabled:renderer.shadowMap.enabled,toneMappingExposure:renderer.toneMappingExposure,contactOcclusion:false,detail:'Full authored room geometry'},renderer:renderer.info.render})};window.ready=true;
</script></body></html>
